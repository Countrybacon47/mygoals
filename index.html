<script>

function mAvg(y,m){var a=[];for(var k in S.log){var d=pd(k);if(d.getFullYear()==y&&d.getMonth()==m)a.push(dav(S.log[k]))}return mean(a)}

else{S.tiles.forEach(function(id){h+=(id=="weight"||id=="food")?'<div class="tile'+(U.ex[id]?' x':'')+'" data-a="open" data-id="'+id+'">'+svg(id)+NM[id]+(U.ex[id]?'<div class="gi">'+(id=="food"?FI():GI())+'</div>':'<span class="sw">swipe down ↓</span>')+'</div>':'<div class="tile" data-a="open" data-id="'+id+'">'+svg(id)+NM[id]+'</div>'});
